<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Joyeux anniversaire Melvin</title>
  <!-- Police d'écriture (Pacifico) -->
  <link href="https://fonts.googleapis.com/css2?family=Pacifico&display=swap" rel="stylesheet">
  <!-- On relie le fichier CSS (le style) -->
  <link rel="stylesheet" href="asset/app.css">
</head>
<body>
 
  <!-- La scène : le grand rectangle rose qui contient tout -->
  <div class="scene">
 
    <!-- Texte du haut -->
    <div class="titre">Joyeux anniversaire !</div>
 
    <!-- Confettis : un div par confetti (la couleur et la vitesse sont réglées dans le CSS) -->
    <div class="confetti c1"></div>
    <div class="confetti c2"></div>
    <div class="confetti c3"></div>
    <div class="confetti c4"></div>
    <div class="confetti c5"></div>
    <div class="confetti c6"></div>
    <div class="confetti c7"></div>
    <div class="confetti c8"></div>
 
    <!-- Assiette sous le gâteau -->
    <div class="assiette"></div>
 
    <!-- Étage du bas (chocolat) -->
    <div class="etage bas">
      <!-- Glaçage rose + ses gouttes (les balises <i>) -->
      <div class="glacage">
        <i class="g1"></i><i class="g2"></i><i class="g3"></i><i class="g4"></i><i class="g5"></i>
      </div>
      <div class="prenom">Melvin</div>
      <div class="points points-bas"></div>
    </div>
 
    <!-- Étage du milieu (rose) -->
    <div class="etage milieu">
      <!-- Glaçage blanc + ses gouttes -->
      <div class="glacage blanc">
        <i class="g1"></i><i class="g2"></i><i class="g3"></i><i class="g4"></i>
      </div>
      <div class="coeurs">
        <span>♥</span><span>♥</span><span>♥</span><span>♥</span>
      </div>
      <div class="points points-milieu"></div>
    </div>
 
    <!-- Étage du haut (crème) -->
    <div class="etage haut">
      <div class="glacage">
        <i class="g1"></i><i class="g2"></i><i class="g3"></i><i class="g4"></i>
      </div>
      <div class="points points-haut"></div>
    </div>
 
    <!-- Les 3 bougies : bleue, rose, verte -->
    <div class="bougie bleue"></div>
    <div class="bougie rose"></div>
    <div class="bougie verte"></div>
 
  </div>
 
</body>
</html>
