<!DOCTYPE html>
<html lang="fr">
<head>
    <title>Drapeaux</title>
     <link rel="stylesheet" href="asset/app.css">
</head>

<body>
   <div id ="ligne-haut"> <!-- div id pour la ligne du haut, facilitera pour ranger les drapeaux -->
    <div id="thailande">   <!-- div id pour le drapeau de la thailande -->
      <div class ="partie-haute">  <!-- div class pour la premiere partie du drapeau -->
        <div class ="th-drapeaux-rouge"></div>  <!-- div class pour la partie rouge -->
        <div class ="th-drapeaux-blanc"></div>  <!-- div class pour la partie blanche -->
      </div>

      <div class="partie-basse"> <!-- div class pour la premiere basse du drapeau -->
        <div class ="th-drapeaux-blanc"></div>
        <div class ="th-drapeaux-rouge"></div>
      </div>
    </div> <!-- fin div class du drapeau -->

<div id ="suisse"> <!-- div id pour drapeau suisse -->
    <div class="su-horizontale"></div> <!-- div class pour partie horizontale -->
    <div class ="su-verticale"></div> <!-- div class pour partie verticale -->
</div> <!--fin div du drapeau -->
</div> <!-- fin div de la premiere ligne -->

<div id ="ligne-centre"> <!-- div id pour ligne au milieu -->
  <div id ="england"> <!-- div id pourle drapeau anglais -->
     <div class ="en-horizontale"></div> <!-- div class pour l'horizontale -->
      <div class ="en-verticale"></div> <!--div class pour la verticale -->
  </div> <!--fin div du drapeau -->
</div> <!-- fin div de la ligne au milieu -->


 <div id ="ligne-bas">  <!-- div id pour ligne du bas -->
   <div id ="hongrie"> <!--fin div du drapeau hongrois -->
    <div class = "hon-haut"></div>  <!-- div class pour la partie haute -->
    <div class ="hon-bas"></div> <!-- div class pour la partie basse -->
   </div> <!--fin div du drapeau -->

    <div id="botswana"> <!-- meme technique que pour le drapeau de la thailande -->
        <div class ="partie-haute">
            <div class = "bo-bleu"></div>
            <div class ="bo-blanc"></div>
        </div>
        <div class ="partie-basse">
             <div class ="bo-blanc"></div>
            <div class = "bo-bleu"></div>
           
        </div>
   </div>

 </div> <!-- fin div de la derniere ligne -->


<div id ="thailande1"></div>
<div id="botswana1"></div>
</body>
</html>
